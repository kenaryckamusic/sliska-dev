<!doctype html>
<html lang="pl"><head><script>try{if(self===top){location.replace('/?open='+encodeURIComponent(location.pathname+location.search+location.hash))}}catch(e){}</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DEV · Centrum wiedzy – Śliska News</title>
<link rel="icon" href="/news/icons-dev/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('sliska_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<script src="/news/dev-art.js"></script>
<script src="/news/dev-gate.js"></script>
<style>
:root{--accent:#d6001c;--text:#1a1a1a;--muted:#667085;--bg:#f4f5f7;--card:#fff;--border:#e4e7ec}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--text:#ececec;--muted:#a3a3a3;--bg:#121212;--card:#1c1c1c;--border:#2e2e2e}}
:root[data-theme=dark]{--text:#ececec;--muted:#a3a3a3;--bg:#121212;--card:#1c1c1c;--border:#2e2e2e}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wz-eye{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}

/* Centrum wiedzy (#/wiedza) */
.wz{max-width:980px;margin:0 auto;padding:24px 16px 60px}
.wz-h h1{margin:6px 0 8px;font-size:2rem}.wz-h p{color:var(--muted,#777);margin:0 0 14px}
.wz-nav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 24px}
.wz-nav a{padding:7px 13px;border-radius:999px;border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:.88rem;background:var(--card,#fff)}
.wz-nav a:hover{border-color:var(--accent)}
.wz-s{margin:0 0 34px;scroll-margin-top:120px}.wz-s h2{font-size:1.4rem;margin:0 0 12px}.wz-s h3{font-size:1.05rem;margin:22px 0 8px}
.wz-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--card,#fff)}
.wz-t{width:100%;border-collapse:collapse;font-size:.9rem}.wz-t th,.wz-t td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
.wz-t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#777)}.wz-t tr:last-child td{border-bottom:0}
.wz-l{padding-left:20px;line-height:1.55}.wz-l li{margin:5px 0}.wz-n{color:var(--muted,#777);font-size:.88rem}
.wz-d{margin:10px 0}.wz-d>summary{cursor:pointer;padding:10px 4px;font-size:1rem}.wz-d summary small{color:var(--muted,#777);margin-left:6px}
.wz-hid{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.06em}
.wz code{background:rgba(127,127,127,.15);padding:1px 6px;border-radius:6px}

</style></head><body>
<div id="app"></div>
<script src="/news/poziomy.js"></script>
<script src="/news/gry.js"></script>
<script src="/wiedza/wiedza.js"></script>
<script>Wiedza.render(document.getElementById('app'));</script>
</body></html>
